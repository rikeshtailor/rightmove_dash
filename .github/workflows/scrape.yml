name: Rightmove Scraper

on:
  workflow_dispatch:
    inputs:
      rightmove_only:
        description: "Rightmove scrape only (no SpareRoom, no analysis)"
        type: boolean
        default: false
      spareroom_only:
        description: "SpareRoom scrape only (no Rightmove, no analysis)"
        type: boolean
        default: false
      analyse_only:
        description: "Analysis and email only (no scraping)"
        type: boolean
        default: false
      retry_failed:
        description: "Retry previously failed Rightmove URLs"
        type: boolean
        default: false
      rebuild_from_all:
        description: "Rebuild Rightmove parquet from all collected URLs"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"  # every Monday at 06:00 UTC

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150  # 2.5 hours — leaves buffer for setup + commit, ~11 runs/month
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install aiohttp pandas pyarrow beautifulsoup4 shapely

      - name: Run Rightmove scrape
        if: ${{ inputs.spareroom_only != true && inputs.analyse_only != true }}
        env:
          OUTCODE_CSV: ${{ github.workspace }}/outercode_to_postcode_master.csv
        run: |
          ARGS="--scrape-only --time-limit 130"
          if [ "${{ inputs.retry_failed }}" = "true" ]; then ARGS="$ARGS --retry-failed"; fi
          if [ "${{ inputs.rebuild_from_all }}" = "true" ]; then ARGS="$ARGS --rebuild-from-all"; fi
          python scraper_alternative.py $ARGS

      - name: Push Rightmove parquet to repo
        if: ${{ inputs.spareroom_only != true && inputs.analyse_only != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rightmove_*.parquet || true
          git diff --cached --quiet && echo "No parquet to push." && exit 0
          git commit -m "data: scrape $(date +'%Y-%m-%d')"
          git push

      - name: Run SpareRoom scrape
        if: ${{ inputs.rightmove_only != true && inputs.analyse_only != true }}
        env:
          OUTCODE_CSV: ${{ github.workspace }}/outercode_to_postcode_master.csv
        run: python scraper_alternative.py --spareroom-only

      - name: Push SpareRoom data to repo
        if: ${{ always() && inputs.rightmove_only != true && inputs.analyse_only != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add data/spareroom_offered.parquet data/spareroom_wanted.parquet || true
          git diff --cached --quiet && echo "No SpareRoom data to push." && exit 0
          git commit -m "data: spareroom $(date +'%Y-%m-%d')"
          git push

      - name: Run analysis and send email
        if: ${{ inputs.rightmove_only != true && inputs.spareroom_only != true }}
        env:
          OUTCODE_CSV: ${{ github.workspace }}/outercode_to_postcode_master.csv
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          HMO_EMAIL_TO: ${{ secrets.HMO_EMAIL_TO }}
        run: python scraper_alternative.py --analyse-only
