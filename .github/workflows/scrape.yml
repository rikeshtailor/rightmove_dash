name: Rightmove Scraper

on:
  workflow_dispatch:
    inputs:
      retry_failed:
        description: "Retry previously failed URLs"
        type: boolean
        default: false
      rebuild_from_all:
        description: "Rebuild parquet from all collected URLs"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"  # every Monday at 06:00 UTC

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150  # 2.5 hours — leaves buffer for setup + commit, ~11 runs/month
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install aiohttp pandas pyarrow

      - name: Run scraper
        env:
          OUTCODE_CSV: ${{ github.workspace }}/outercode_to_postcode_master.csv
        run: |
          ARGS="--time-limit 130"
          if [ "${{ inputs.retry_failed }}" = "true" ]; then ARGS="$ARGS --retry-failed"; fi
          if [ "${{ inputs.rebuild_from_all }}" = "true" ]; then ARGS="$ARGS --rebuild-from-all"; fi
          python scraper_alternative.py $ARGS

      - name: Commit state.json (for resume support)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add state.json data/ || true
          git diff --cached --quiet || git commit -m "chore: update scraper state [run ${{ github.run_number }}]"
          git push
